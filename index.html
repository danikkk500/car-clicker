<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Car Clicker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #12141a;
    --card: #1c1f29;
    --card2: #252a37;
    --text: #f2f4f8;
    --muted: #8b92a5;
    --accent: #ffb703;
    --accent2: #fb8500;
    --good: #2ecc71;
    --bad: #e74c3c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }

  /* верхняя панель */
  .top { padding: 12px 16px 4px; text-align: center; }
  .coins { font-size: 38px; font-weight: 800; color: var(--accent); letter-spacing: .5px; }
  .coins small { font-size: 20px; color: var(--accent2); }
  .rates { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .rates b { color: var(--text); font-weight: 600; }

  /* экраны */
  .screen { flex: 1; display: none; flex-direction: column; min-height: 0; }
  .screen.active { display: flex; }

  /* игра */
  .carname { text-align: center; font-size: 20px; font-weight: 700; margin-top: 6px; }
  .carsub { text-align: center; font-size: 13px; color: var(--muted); }
  .stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #car { width: min(86vw, 380px); transition: transform .06s ease-out; filter: drop-shadow(0 14px 18px rgba(0,0,0,.55)); }
  #car.hit { transform: scale(.94) rotate(-1deg); }
  .road { position: absolute; left: 0; right: 0; bottom: 18%; height: 4px; background: repeating-linear-gradient(90deg, #3a3f4f 0 26px, transparent 26px 52px); opacity: .7; animation: road 0.6s linear infinite; }
  @keyframes road { to { background-position: -52px 0; } }
  .float { position: absolute; pointer-events: none; font-weight: 800; font-size: 26px; color: var(--accent); text-shadow: 0 2px 6px rgba(0,0,0,.6); animation: floatUp .8s ease-out forwards; }
  @keyframes floatUp { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-90px) scale(1.25); } }

  .progress-wrap { padding: 0 16px; }
  .bar { height: 12px; background: var(--card2); border-radius: 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width .15s; }
  .bar.energy > i { background: linear-gradient(90deg, #3a86ff, #4cc9f0); }
  .barlabel { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin: 4px 2px 8px; }

  /* магазин */
  .list { flex: 1; overflow-y: auto; padding: 8px 12px 12px; -webkit-overflow-scrolling: touch; }
  .group { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin: 12px 4px 6px; }
  .item { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 8px; border: 1px solid transparent; }
  .item .ico { font-size: 28px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: var(--card2); border-radius: 12px; flex: none; }
  .item .info { flex: 1; min-width: 0; }
  .item .name { font-weight: 700; font-size: 15px; }
  .item .desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .item .lvl { font-size: 12px; color: var(--accent); }
  .buy { flex: none; background: var(--accent); color: #1a1a1a; border: 0; border-radius: 10px; padding: 9px 12px; font-weight: 800; font-size: 14px; min-width: 84px; }
  .buy:disabled { background: var(--card2); color: var(--muted); }
  .item.owned { border-color: rgba(46,204,113,.5); }
  .item.locked { opacity: .45; }
  .item.current { border-color: var(--accent); }

  /* нижнее меню */
  .tabs { display: flex; background: var(--card); border-top: 1px solid #2a2f3d; }
  .tab { flex: 1; padding: 10px 0 12px; text-align: center; font-size: 12px; color: var(--muted); border: 0; background: none; }
  .tab .e { display: block; font-size: 22px; margin-bottom: 2px; }
  .tab.active { color: var(--accent); }

  /* всплывающее окно */
  .toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%) scale(.9); background: var(--card); border: 2px solid var(--accent); border-radius: 18px; padding: 18px 22px; text-align: center; opacity: 0; pointer-events: none; transition: all .25s; z-index: 10; max-width: 86vw; }
  .toast.show { opacity: 1; transform: translateX(-50%) scale(1); }
  .toast h3 { margin: 0 0 6px; color: var(--accent); }
  .toast p { margin: 0; font-size: 14px; color: var(--muted); }
  .center { text-align: center; padding: 16px; color: var(--muted); font-size: 13px; }
  .resetbtn { background: none; border: 1px solid var(--bad); color: var(--bad); border-radius: 10px; padding: 8px 14px; margin-top: 6px; }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="coins"><span id="coins">0</span> <small>₽</small></div>
    <div class="rates">за тап: <b id="perTap">1</b> · в секунду: <b id="perSec">0</b> · бонус машины: <b id="carMult">x1</b></div>
  </div>

  <!-- Игра -->
  <section class="screen active" id="screen-game">
    <div class="carname" id="carName">ВАЗ-2107</div>
    <div class="carsub" id="carSub"></div>
    <div class="stage" id="stage">
      <div class="road"></div>
      <div id="carBox"></div>
    </div>
    <div class="progress-wrap">
      <div class="barlabel"><span id="nextLabel">До следующей машины</span><span id="nextPct">0%</span></div>
      <div class="bar"><i id="carProg"></i></div>
      <div class="barlabel"><span>⚡ Энергия</span><span id="energyText">0 / 0</span></div>
      <div class="bar energy"><i id="energyBar"></i></div>
    </div>
    <div style="height:10px"></div>
  </section>

  <!-- Тюнинг -->
  <section class="screen" id="screen-shop">
    <div class="list" id="shopList"></div>
  </section>

  <!-- Гараж -->
  <section class="screen" id="screen-garage">
    <div class="list" id="garageList"></div>
  </section>

  <div class="tabs">
    <button class="tab active" data-tab="game"><span class="e">👆</span>Тапать</button>
    <button class="tab" data-tab="shop"><span class="e">🔧</span>Тюнинг</button>
    <button class="tab" data-tab="garage"><span class="e">🚗</span>Гараж</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="game.js"></script>
</body>
</html>
